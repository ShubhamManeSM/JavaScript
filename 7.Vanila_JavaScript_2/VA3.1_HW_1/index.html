<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Priority To-Do List</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"/>
  </head>
  <body class="p-4">
    <h1 class="mb-4">Priority To-Do List</h1>
    <div class="input-group mb-4">
      <input id="taskInput" type="text" class="form-control" placeholder="Add a new task" />
      <select id="selectPriority" class="form-select">
        <option value="Low Priority">Low Priority</option>
        <option value="Medium Priority">Medium Priority</option>
        <option value="High Priority">High Priority</option>
      </select>
      <button id="addPriorityBtn" class="btn btn-primary">Add</button>
    </div>

    <div class="row">
      <div class="col">
        <h3>Low Priority</h3>
        <div id="lowPriorityList" class="d-grid gap-2"></div>
      </div>
      <div class="col">
        <h3>Medium Priority</h3>
        <div id="mediumPriorityList" class="d-grid gap-2"></div>
      </div>
      <div class="col">
        <h3>High Priority</h3>
        <div id="highPriorityList" class="d-grid gap-2"></div>
      </div>
    </div>

    <script>
      const taskInput = document.getElementById('taskInput');
      const selectPriority = document.getElementById('selectPriority');
      const addPriorityBtn = document.getElementById('addPriorityBtn');

      const lowPriorityList = document.getElementById('lowPriorityList');
      const mediumPriorityList = document.getElementById('mediumPriorityList');
      const highPriorityList = document.getElementById('highPriorityList');

      addPriorityBtn.addEventListener('click', function () {
        const taskText = taskInput.value;
        const priority = selectPriority.value;

        const taskCard = document.createElement('div');
        taskCard.className = 'card p-3 d-flex flex-row justify-content-between align-items-center';
        taskCard.innerHTML = `
          <span>${taskText}</span>
          <button class="btn btn-danger btn-sm">Delete</button>
        `;

        const deleteBtn = taskCard.querySelector('button');
        deleteBtn.addEventListener('click', function () {
          taskCard.remove();
        });

        if (priority === 'Low Priority') {
          lowPriorityList.appendChild(taskCard);
        } else if (priority === 'Medium Priority') {
          mediumPriorityList.appendChild(taskCard);
        } else {
          highPriorityList.appendChild(taskCard);
        }

        taskInput.value = '';
      });
    </script>

  </body>
</html>

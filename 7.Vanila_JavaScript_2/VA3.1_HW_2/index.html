<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Personal Finance Tracker</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"/>
  </head>
  <body class="p-4">
    <h1 class="mb-4">Personal Finance Tracker</h1>
    <div class="input-group mb-4">
      <input id="transactionName" type="text" class="form-control" placeholder="Transaction Name" />
      <input id="transactionAmount" type="number" class="form-control" placeholder="Amount" />
      <button id="addTransactionBtn" class="btn btn-primary">Add</button>
    </div>

    <div id="transactionList" class="d-grid gap-2"></div>

    <script>
      const transactionName = document.getElementById('transactionName');
      const transactionAmount = document.getElementById('transactionAmount');
      const addTransactionBtn = document.getElementById('addTransactionBtn');
      const transactionList = document.getElementById('transactionList');

      addTransactionBtn.addEventListener('click', function () {
        const name = transactionName.value; 
        const amount = transactionAmount.value; 
        const transactionCard = document.createElement('div');
        transactionCard.className = 'card p-3 d-flex flex-row justify-content-between align-items-center';
        transactionCard.innerHTML = `
          <span>${name} Rs.${parseFloat(amount).toFixed(2)}</span>
          <button class="btn btn-danger btn-sm">Delete</button>
        `;

        const deleteBtn = transactionCard.querySelector('button');
        deleteBtn.addEventListener('click', function () {
          transactionCard.remove();
        });

        transactionList.appendChild(transactionCard);

        transactionName.value = '';
        transactionAmount.value = '';
      });
    </script>

  </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Calories</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg text-secondary">
                <div class="container">
                <a class="navbar-brand" href="index.html">Calorie & Workout Report</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                  </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                  <li class="nav-item"><a class="nav-link" href="calories.html">Calories</a></li>
                  <li class="nav-item"><a class="nav-link" href="report.html">Workout</a></li>
                </ul>
            </div>
            </div>

              </nav>
            </header>

          <div class="container mt-4">
    
            <form>
                <div class="mb-3">
                    <label for="dayInput">Day:</label>
                    <input type="text" id="dayInput" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="caloriesConsumedInput">Calories Consumed:</label>
                    <input type="number" id="caloriesConsumedInput" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="caloriesBurnedInput">Calories Burned:</label>
                    <input type="number" id="caloriesBurnedInput" class="form-control" required>
                </div>
                <button type="button" class="btn btn-primary" id="addCaloriesBtn">Add Calories</button>
            </form>
    
            <section class="container mt-4">
                <div id="calorieList" class="row"></div>
            </section>
        </div>
    
        <script>
            const calories = [
                { id: 1, day: "Day 1", consumed: 2000, burned: 300 },
                { id: 2, day: "Day 2", consumed: 1800, burned: 400 },
            ];
    
            const addCaloriesBtn = document.querySelector("#addCaloriesBtn");
            const calorieList = document.querySelector("#calorieList");
    
            function updateCalorieList(filteredCalories) {
                calorieList.innerHTML = '';
                for (let i = 0; i < filteredCalories.length; i++) {
                    const col = document.createElement('div');
                    col.className = 'col-md-4';
    
                    const card = document.createElement('div');
                    card.className = 'card mb-3';
    
                    const cardHeader = document.createElement('div');
                    cardHeader.className = 'card-header';
                    const h4 = document.createElement('h4');
                    h4.textContent = filteredCalories[i].day;
    
                    cardHeader.appendChild(h4);
    
                    const cardBody = document.createElement('div');
                    cardBody.className = 'card-body';
    
                    const consumed = document.createElement('p');
                    consumed.className = 'card-text';
                    consumed.innerHTML = `<strong>Calories Consumed:</strong> ${filteredCalories[i].consumed}`;
    
                    const burned = document.createElement('p');
                    burned.className = 'card-text';
                    burned.innerHTML = `<strong>Calories Burned:</strong> ${filteredCalories[i].burned}`;
    
                    cardBody.appendChild(consumed);
                    cardBody.appendChild(burned);
    
                    card.appendChild(cardHeader);
                    card.appendChild(cardBody);
    
                    col.appendChild(card);
                    calorieList.appendChild(col);
                }
            }
    
            addCaloriesBtn.addEventListener("click", function () {
                const day = document.querySelector("#dayInput").value.trim();
                const caloriesConsumed = document.querySelector("#caloriesConsumedInput").value.trim();
                const caloriesBurned = document.querySelector("#caloriesBurnedInput").value.trim();
    
                if (day && caloriesConsumed && caloriesBurned) {
                    const newCalorieId = calories.length + 1;
                    const newEntry = {
                        id: newCalorieId,
                        day: day,
                        consumed: caloriesConsumed,
                        burned: caloriesBurned
                    };
    
                    calories.push(newEntry);
    
                    updateCalorieList(calories);
                }
            });
    
            updateCalorieList(calories);
        </script>
        
    </body>
</html>

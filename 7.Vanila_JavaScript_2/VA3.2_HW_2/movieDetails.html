<!DOCTYPE html>
<!DOCTYPE html>
<html>
  <head>
    <title>Movie Details</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg text-secondary">
        <div class="container">
          <a class="navbar-brand" href="index.html">Movies Database</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="movies.html">Movies</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="report.html">Report</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="container mt-4">
      <h1>Movies Details</h1>
      <section id="movieDetails"></section>
    </main>

    <script>
      let movies = [
        {
          id: "1",
          genre: "Action",
          details: "This is an action-packed movie.",
        },
        {
          id: "2",
          genre: "Drama",
          details: "A dramatic story unfolds in this movie.",
        },
        {
          id: "3",
          genre: "Comedy",
          details: "A Comedy stroy make people laugh in this movie.",
        },
      ];

      function getParameterById(id) {
        let url = new URL(window.location.href);
        return url.searchParams.get(id);
      }
      let movieId = getParameterById("id");
      let movie = null;
      for (let i = 0; i < movies.length; i++) {
        if (movies[i].id === movieId) {
          movie = movies[i];
        }
      }
      let movieDetailsElement = document.getElementById("movieDetails");
      if (movie) {
        movieDetailsElement.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                       <div class="card">
                        <div class="card-header">
                            <h2>Movie ${movie.id}</h2>     
                            </div>
                            <div class="card-body">
                <p><strong>Country: </strong>${movie.genre}</p>
                <p><strong>Role: </strong>${movie.details}</p>
                </div>
                </div>
                </div>
                 `;
      } else {
        movieDetailsElement.innerHTML = "Movie Not Found";
      }
    </script>
  </body>
</html>


<!DOCTYPE html>
<html>
    <head>
        <title>Employee Details</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <header class="bg-dark text-light text-center py-3">
            <h1>Employee Details</h1>
        </header>
        <main class="container mt-4">
           <section id="employeeDetail">

           </section> 
        </main>

        <script>
            let employees = [
                {id:"1", name: "John Doe", title: "Software Developer", department: "IT"},
                {id:"2", name: "Jane Smith", title: "Designer", department: "Design"},
                {id:"3", name: "Bob Johnson", title: "Project Manager", department: "Management"}
            ]

            function getParameterById(id){
                // get the id from the url
                
                let url = new URL(window.location.href)
    
                console.log(typeof url)
               return url.searchParams.get(id)
            }
            let employeeId = getParameterById('id')

            for(i = 0; i < employees.length;i++){
                if(employees[i].id === employeeId){
                    employee = employees[i]
                }
            }

            let employeeDetailElement = document.getElementById('employeeDetail');
            if(employee){
                employeeDetailElement.innerHTML = `
                <div class="card">
                <div class="card-body">
                <h2 class="card-title">${employee.name}</h2>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Name: ${employee.name}</li>
                    <li class="list-group-item">Designation: ${employee.title}</li>
                    <li class="list-group-item">Department: ${employee.department}</li>
                        </ul>
                        </div>
                        </div>
                `
            }else{
                employeeDetailElement.innerHTML = 'Employee Not Found.'
            }
        </script>
    </body>
</html>

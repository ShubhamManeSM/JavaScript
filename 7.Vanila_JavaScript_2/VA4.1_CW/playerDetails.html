        const players = [
            { id: 1, name: "Akanksha", country: "India", role: "Batsman" },
            { id: 2, name: "Virat", country: "India", role: "Bowler" },
            { id: 3, name: "Rohit", country: "Australia", role: "Batsman" }
        ];

        function getParameterByName(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        function showPlayerDetails() {
            const playerId = parseInt(getParameterByName('id'));
            const player = players.find(p => p.id === playerId);

            const playerDetailDiv = document.querySelector("#playerDetails");

            if (player) {
                const col = document.createElement('div');
                col.className = 'col-md-6';

                const card = document.createElement('div');
                card.className = 'card mb-3';

                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header';
                const h2 = document.createElement('h2');
                h2.textContent = `Player ${player.id}`;

                cardHeader.appendChild(h2);

                const cardBody = document.createElement('div');
                cardBody.className = 'card-body';

                const playerCountry = document.createElement('p');
                playerCountry.className = 'card-text';
                playerCountry.innerHTML = `<strong>Country: </strong> ${player.country}`;

                const playerRole = document.createElement('p');
                playerRole.className = 'card-text';
                playerRole.innerHTML = `<strong>Role: </strong> ${player.role}`;

                cardBody.appendChild(playerCountry);
                cardBody.appendChild(playerRole);

                card.appendChild(cardHeader);
                card.appendChild(cardBody);

                col.appendChild(card);

                playerDetailDiv.appendChild(col);
            } else {
                playerDetailDiv.innerHTML = '<p>Player Not Found</p>';
            }
        }

        showPlayerDetails();
        </script>

<!DOCTYPE html>
<html>
    <head>
        <title>Company</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <header class="bg-dark text-light text-center py-3">
            <h1>List of Employees</h1>
        </header>
        
        <section class="container mt-4">
            <div class="mb-3 w-50">
                <label for="departmentFilter">Filter by Department:</label>
                <select id="departmentFilter" class="form-select">
                    <option value="All">All Departments</option>
                    <option value="IT">IT</option>
                    <option value="Design">Design</option>
                    <option value="Management">Management</option>
                </select>
            </div>
    
            <h2>Add Employee</h2>
            <form>
                <div class="mb-3">
                    <label for="employeeName">Name:</label>
                    <input id="employeeName" type="text" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="employeeTitle">Title:</label>
                    <input id="employeeTitle" type="text" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="employeeDepartment">Department:</label>
                    <select id="employeeDepartment" class="form-select" required>
                        <option value="IT">IT</option>
                        <option value="Design">Design</option>
                        <option value="Management">Management</option>
                    </select>
                </div>
                <button type="button" class="btn btn-primary" id="addEmployeeBtn">Add Employee</button>
            </form>
        </section>
    
        
        <section class="container mt-4">
            <div id="employeeList" class="list-group"></div>
        </section>
    
        <script>
            const employees = [
                { id: 1, name: "John Doe", title: "Software Developer", department: "IT" },
                { id: 2, name: "Jane Smith", title: "Designer", department: "Design" },
                { id: 3, name: "Bob Johnson", title: "Project Manager", department: "Management" }
            ];
    
            const addEmployeeBtn = document.querySelector("#addEmployeeBtn");
            const employeeList = document.querySelector("#employeeList");
            const departmentFilter = document.querySelector("#departmentFilter");

            function updateEmployeeList(selectedDepartment) {
            employeeList.innerHTML = '';

            for (let i = 0; i < employees.length; i++) {
            if (selectedDepartment === "All" || employees[i].department === selectedDepartment) {
            const listItem = document.createElement('div');
            listItem.className = 'list-group-item d-flex justify-content-between align-items-center';

            const employeeInfo = document.createElement('div');

            const employeeName = document.createElement('h5');
            employeeName.textContent = employees[i].name;

            const employeeTitle = document.createElement('p');
            employeeTitle.className = 'mb-0';
            employeeTitle.textContent = employees[i].title;

            employeeInfo.appendChild(employeeName);
            employeeInfo.appendChild(employeeTitle);

            const detailsLink = document.createElement('a');
            detailsLink.href = `employeeDetails.html?id=${employees[i].id}`;
            detailsLink.textContent = 'Details';
            detailsLink.style.color = 'blue';
            detailsLink.style.textDecoration = 'underline';

            listItem.appendChild(employeeInfo);
            listItem.appendChild(detailsLink);

            employeeList.appendChild(listItem);
        }
    }
}

            
    
            addEmployeeBtn.addEventListener("click", function () {
                const employeeName = document.querySelector("#employeeName").value;
                const employeeTitle = document.querySelector("#employeeTitle").value;
                const employeeDepartment = document.querySelector("#employeeDepartment").value;
    
                if (employeeName && employeeTitle && employeeDepartment) {
                    const newEmployeeId = employees.length + 1;
                    const newEmployee = {
                        id: newEmployeeId,
                        name: employeeName,
                        title: employeeTitle,
                        department: employeeDepartment
                    };
                    employees.push(newEmployee);

                    updateEmployeeList(departmentFilter.value);
                } 
            });
    
            departmentFilter.addEventListener("change", function () {
                updateEmployeeList(departmentFilter.value);
            });
    
            updateEmployeeList("All");
        </script>
    </body>
</html>

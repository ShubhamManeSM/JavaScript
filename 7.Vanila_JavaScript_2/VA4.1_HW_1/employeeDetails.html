            let employees = [
                {id:"1", name: "John Doe", designation: "Software Developer", department: "IT"},
                {id:"2", name: "Jane Smith", designation: "Designer", department: "Design"},
                {id:"3", name: "Bob Johnson", designation: "Project Manager", department: "Management"}
            ]


        function getParameterByName(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        function showEmployeeDetails() {
            const EmployeeId = getParameterByName('id');
            const employee = employees.find(p => p.id === EmployeeId);

            const employeeDetailDiv = document.querySelector("#employeeDetails");

            if (employee) {
                const col = document.createElement('div');
                col.className = 'col-md-6';

                const card = document.createElement('div');
                card.className = 'card mb-3';

                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header';
                const h2 = document.createElement('h2');
                h2.textContent = `${employee.name}`;

                cardHeader.appendChild(h2);

                const cardBody = document.createElement('div');
                cardBody.className = 'card-body';

                const employeeName = document.createElement('p');
                employeeName.className = 'card-text';
                employeeName.innerHTML = `<strong>Name: </strong> ${employee.name}`;

                const employeeDesignation = document.createElement('p');
                employeeDesignation.className = 'card-text';
                employeeDesignation.innerHTML = `<strong>Designation: </strong> ${employee.designation}`;

                const employeeDepartment = document.createElement('p');
                employeeDepartment.className = 'card-text';
                employeeDepartment.innerHTML = `<strong>Department: </strong> ${employee.department}`;

                cardBody.appendChild(employeeName);
                cardBody.appendChild(employeeDesignation);
                cardBody.appendChild(employeeDepartment);

                card.appendChild(cardHeader);
                card.appendChild(cardBody);

                col.appendChild(card);

                employeeDetailDiv.appendChild(col);
            } else {
                employeeDetailDiv.innerHTML = '<p>Employee Not Found</p>';
            }
        }

        showEmployeeDetails();
        </script>

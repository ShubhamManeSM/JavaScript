<!DOCTYPE html>
<html>
    <head>
        <title>Report</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <header>
            <h1>HR Report</h1>
            <hr>     
        </header>
      
        <section class="container mt-4">
        <div class="row" id="employee-report">

        </div>
    </section>

    <script>
       function generateEmployeeReport() {
                const mostWorkedEmployee = { name: "John Doe", hoursWorked: 210 };
                const highestRatedEmployee = { name: "Jane Smith", performanceRate: 0.95 };
                const totalOvertime = { overtimeHours: 35 };

                const employeeReportDiv = document.querySelector("#employee-report");

                function createCard(cardObj) {
                    const col = document.createElement('div');
                    col.className = 'col-md-4';

                    const card = document.createElement('div');
                    card.className = 'card mb-3';

                    const cardHeader = document.createElement('div');
                    cardHeader.className = 'card-header';
                    const h2 = document.createElement('h2');

                    if (cardObj === mostWorkedEmployee) {
                        h2.textContent = 'Most Worked Employee';
                    } else if (cardObj === highestRatedEmployee) {
                        h2.textContent = 'Highest Rated Employee';
                    } else if (cardObj === totalOvertime) {
                        h2.textContent = 'Total Overtime Hours';
                    }

                    cardHeader.appendChild(h2);

                    const cardBody = document.createElement('div');
                    cardBody.className = 'card-body';

                    if (cardObj === mostWorkedEmployee) {
                        const name = document.createElement('p');
                        name.className = 'card-text';
                        name.innerHTML = `<strong>name: </strong> ${cardObj.name}`;

                        const hours = document.createElement('p');
                        hours.className = 'card-text';
                        hours.innerHTML = `<strong>hoursWorked: </strong> ${cardObj.hoursWorked}`;

                        cardBody.appendChild(name);
                        cardBody.appendChild(hours);
                    } else if (cardObj === highestRatedEmployee) {
                        const name = document.createElement('p');
                        name.className = 'card-text';
                        name.innerHTML = `<strong>name: </strong> ${cardObj.name}`;

                        const rate = document.createElement('p');
                        rate.className = 'card-text';
                        rate.innerHTML = `<strong>performanceRate: </strong> ${cardObj.performanceRate}`;

                        cardBody.appendChild(name);
                        cardBody.appendChild(rate);
                    } else if (cardObj === totalOvertime) {
                        const overtime = document.createElement('p');
                        overtime.className = 'card-text';
                        overtime.innerHTML = `<strong>overtimeHours: </strong> ${cardObj.overtimeHours}`;

                        cardBody.appendChild(overtime);
                    }

                    card.appendChild(cardHeader);
                    card.appendChild(cardBody);

                    col.appendChild(card);

                    employeeReportDiv.appendChild(col);
                }

                createCard(mostWorkedEmployee);
                createCard(highestRatedEmployee);
                createCard(totalOvertime);
            }

            generateEmployeeReport();
        </script>
    </body>
</html>

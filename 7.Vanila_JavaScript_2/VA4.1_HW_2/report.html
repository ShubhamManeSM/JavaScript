<!DOCTYPE html>
<html>
    <head>
        <title>Calories</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg text-secondary">
                <div class="container">
                <a class="navbar-brand" href="index.html">Calorie & Workout Report</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                  </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                  <li class="nav-item"><a class="nav-link" href="calories.html">Calories</a></li>
                  <li class="nav-item"><a class="nav-link" href="report.html">Workout</a></li>
                </ul>
            </div>
            </div>
              </nav>
            </header>
            <hr>  

           <section class="container mt-4">
            <div class="row" id="workout-report"></div>
        </section>

        <script>
            function generateWorkoutReport() {
                const day1 = { exercise: "Running", duration: "30 minutes" };
                const day2 = { exercise: "Cycling", duration: "45 minutes" };

                const workoutReportDiv = document.querySelector("#workout-report");

                function createCard(dayObj, dayNumber) {
                    const col = document.createElement('div');
                    col.className = 'col-md-12 mb-3';

                    const card = document.createElement('div');
                    card.className = 'card';

                    const cardHeader = document.createElement('div');
                    cardHeader.className = 'card-header';
                    const h2 = document.createElement('h2');
                    h2.textContent = `Day ${dayNumber}`;

                    cardHeader.appendChild(h2);

                    const cardBody = document.createElement('div');
                    cardBody.className = 'card-body';

                    const exercise = document.createElement('p');
                    exercise.className = 'card-text';
                    exercise.innerHTML = `<strong>Exercise: </strong> ${dayObj.exercise}`;

                    const duration = document.createElement('p');
                    duration.className = 'card-text';
                    duration.innerHTML = `<strong>Duration: </strong> ${dayObj.duration}`;

                    cardBody.appendChild(exercise);
                    cardBody.appendChild(duration);

                    card.appendChild(cardHeader);
                    card.appendChild(cardBody);

                    col.appendChild(card);

                    workoutReportDiv.appendChild(col);
                }

                createCard(day1, 1);
                createCard(day2, 2);
            }

            generateWorkoutReport();
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>List of Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg text-secondary bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Movie Database</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <!-- Presuming this current page is movies.html -->
                    <li class="nav-item"><a class="nav-link active" href="movies.html">Movies</a></li>
                    <li class="nav-item"><a class="nav-link" href="report.html">Report</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">List of Movies</h2>

        <div class="row mb-4">
            <div class="col-md-6">
                <label for="genreFilter" class="form-label">Filter by Genre:</label>
                <select id="genreFilter" class="form-select">
                    <option value="All">All Genres</option>
                    <option value="Action">Action</option>
                    <option value="Drama">Drama</option>
                    <option value="Comedy">Comedy</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="directorFilter" class="form-label">Filter by Director:</label>
                <select id="directorFilter" class="form-select">
                    <option value="All">All Directors</option>
                    <option value="John Doe">John Doe</option>
                    <option value="Jane Smith">Jane Smith</option>
                </select>
            </div>
        </div>

        <form id="addMovieForm">
            <div class="mb-3">
                <label for="titleInput" class="form-label">Title:</label>
                <input type="text" id="titleInput" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="genreInput" class="form-label">Genre:</label>
                <select id="genreInput" class="form-select" required>
                    <option value="" disabled selected>Select genre</option>
                    <option value="Action">Action</option>
                    <option value="Drama">Drama</option>
                    <option value="Comedy">Comedy</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="releaseDateInput" class="form-label">Release Date:</label>
                <input type="date" id="releaseDateInput" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="directorInput" class="form-label">Director:</label>
                <input type="text" id="directorInput" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary" id="addMovieBtn">Add Movie</button>
        </form>

        <section class="container mt-4">
            <div id="movieList" class="row"></div>
        </section>
    </div>

    <script>
        const movies = [
            { id: 1, title: "Movie 1", genre: "Action", releaseDate: "2023-01-15", director: "John Doe" },
            { id: 2, title: "Movie 2", genre: "Drama", releaseDate: "2023-02-20", director: "Jane Smith" },
            { id: 3, title: "Movie 3", genre: "Action", releaseDate: "2023-03-10", director: "John Doe" }
        ];

        const movieList = document.querySelector("#movieList");
        const genreFilter = document.querySelector("#genreFilter");
        const directorFilter = document.querySelector("#directorFilter");
        const addMovieForm = document.querySelector("#addMovieForm");

        function updateMovieList(filteredMovies) {
            movieList.innerHTML = '';
            if (filteredMovies.length === 0) {
                movieList.innerHTML = '<p>No movies found.</p>';
                return;
            }

            filteredMovies.forEach(movie => {
                const col = document.createElement('div');
                col.className = 'col-md-4';

                const card = document.createElement('div');
                card.className = 'card mb-3';

                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header';
                const h4 = document.createElement('h4');
                h4.textContent = movie.title;
                cardHeader.appendChild(h4);

                const cardBody = document.createElement('div');
                cardBody.className = 'card-body';

                const genre = document.createElement('p');
                genre.className = 'card-text';
                genre.innerHTML = `<strong>Genre:</strong> ${movie.genre}`;

                const releaseDate = document.createElement('p');
                releaseDate.className = 'card-text';
                releaseDate.innerHTML = `<strong>Release Date:</strong> ${movie.releaseDate}`;

                const director = document.createElement('p');
                director.className = 'card-text';
                director.innerHTML = `<strong>Director:</strong> ${movie.director}`;

                const detailsLink = document.createElement('a');
                detailsLink.href = `movieDetails.html?id=${movie.id}`;
                detailsLink.className = 'btn btn-primary';
                detailsLink.textContent = `Details`;

                cardBody.append(genre, releaseDate, director, detailsLink);
                card.append(cardHeader, cardBody);
                col.appendChild(card);
                movieList.appendChild(col);
            });
        }

        function filterMovies() {
            const selectedGenre = genreFilter.value;
            const selectedDirector = directorFilter.value;

            let filteredMovies = movies.filter(movie => 
                (selectedGenre === "All" || movie.genre === selectedGenre) &&
                (selectedDirector === "All" || movie.director === selectedDirector)
            );

            updateMovieList(filteredMovies);
        }

        genreFilter.addEventListener('change', filterMovies);
        directorFilter.addEventListener('change', filterMovies);

        // Add movie functionality
        addMovieForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const title = document.querySelector("#titleInput").value.trim();
            const genre = document.querySelector("#genreInput").value;
            const releaseDate = document.querySelector("#releaseDateInput").value;
            const director = document.querySelector("#directorInput").value.trim();

            if (!title || !genre || !releaseDate || !director) {
                alert("Please fill in all required fields.");
                return;
            }

            const newMovie = {
                id: movies.length > 0 ? movies[movies.length - 1].id + 1 : 1,
                title,
                genre,
                releaseDate,
                director
            };

            movies.push(newMovie);

            // Reset form
            addMovieForm.reset();

            // Reset filters to show all
            genreFilter.value = "All";
            directorFilter.value = "All";

            updateMovieList(movies);
        });

        // Initial render
        updateMovieList(movies);
    </script>
</body>
</html>

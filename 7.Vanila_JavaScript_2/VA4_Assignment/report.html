<!DOCTYPE html>
<html>
    <head>
        <title>Movie Report</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg text-secondary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Movie Database</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="movies.html">Movies</a></li>
                    <li class="nav-item"><a class="nav-link" href="report.html">Report</a></li>
                </ul>
            </div>
        </div>
    </nav>
   
    <div class="container mt-4">
        <h2 class="mb-4">Movie Report</h2>

        <section class="container mt-4">
            <div class="row" id="movie-report"></div>
        </section>
    </div>

    <script>
        function generateMovieReport() {
            const movies = [
                { id: 1, title: "Movie 1", genre: "Action", director: "John Doe", rating: 8.5 },
                { id: 2, title: "Movie 2", genre: "Drama", director: "Jane Smith", rating: 9.2 },
                { id: 3, title: "Movie 3", genre: "Action", director: "John Doe", rating: 7.8 },
                { id: 4, title: "Movie 4", genre: "Action", director: "John Doe", rating: 7.9 }
            ];

            const movieReportDiv = document.querySelector("#movie-report");

            let topMovie = movies[0];
            for (let i = 1; i < movies.length; i++) {
                if (movies[i].rating > topMovie.rating) {
                    topMovie = movies[i];
                }
            }

            let genreCounts = {};
            for (let i = 0; i < movies.length; i++) {
                let genre = movies[i].genre;
                if (genreCounts[genre]) {
                    genreCounts[genre]++;
                } else {
                    genreCounts[genre] = 1;
                }
            }

            let maxGenre = "";
            let maxCount = 0;
            for (let genre in genreCounts) {
                if (genreCounts[genre] > maxCount) {
                    maxGenre = genre;
                    maxCount = genreCounts[genre];
                }
            }

            function createCard(title, details) {
                const col = document.createElement('div');
                col.className = 'col-md-6 mb-3';

                const card = document.createElement('div');
                card.className = 'card';

                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header';
                const h2 = document.createElement('h2');
                h2.textContent = title;

                cardHeader.appendChild(h2);

                const cardBody = document.createElement('div');
                cardBody.className = 'card-body';

                for (let i = 0; i < details.length; i++) {
                    const p = document.createElement('p');
                    p.className = 'card-text';
                    p.innerHTML = `<strong>${details[i].label}:</strong> ${details[i].value}`;
                    cardBody.appendChild(p);
                }

                card.appendChild(cardHeader);
                card.appendChild(cardBody);
                col.appendChild(card);

                movieReportDiv.appendChild(col);
            }

            createCard("Top-Rated Movie", [
                { label: "Title", value: topMovie.title },
                { label: "Rating", value: topMovie.rating },
                { label: "Director", value: topMovie.director }
            ]);

            createCard("Most Popular Genre", [
                { label: "Genre", value: maxGenre },
                { label: "Total Movies", value: maxCount }
            ]);
        }

        generateMovieReport();
    </script>
    </body>
</html>

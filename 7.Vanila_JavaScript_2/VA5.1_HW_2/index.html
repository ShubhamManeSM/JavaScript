<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title></title>
  </head>
  <body>
    <h1>JokeAPI - Programming Joke</h1>
    <button id="getDataBtn">Get Programming Joke</button>
    <div id="dataContainer"></div>

    <script>
      const getDataBtn = document.querySelector('#getDataBtn')
      const dataContainer = document.querySelector('#dataContainer')
      const apiURL = "https://v2.jokeapi.dev/joke/Programming?type=single"

      getDataBtn.addEventListener("click",function(){
        fetch(apiURL).then(function responseHandler(response){
          return response.json()
        })
        .then(function showData(data){
          dataContainer.textContent = data.joke
        })
        .catch(function (error){
          dataContainer.textContent = `An error occured while fetching data.`
        })
      })

    </script>
  </body>
</html>

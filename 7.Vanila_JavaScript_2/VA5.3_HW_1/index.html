<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Random Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container mt-3">
      <h1>Random Users</h1>
      <button id="getUserBtn" class="btn btn-primary mt-3">Get Random Users</button>
      <div id="dataContainer" class="mt-3"></div>
    </div>

    <script>
      const getUserBtn = document.querySelector("#getUserBtn");
      const dataContainer = document.querySelector("#dataContainer");

      const apiUrl = "https://randomuser.me/api?results=3";

      getUserBtn.addEventListener("click", function () {
        dataContainer.textContent = 'Loading...';

        fetch(apiUrl)
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            const users = data.results;

            if (users && users.length > 0) {
              let usersData = "";

              for (let i = 0; i < users.length; i++) {
                const user = users[i];
                usersData += `
                  <div class="container mb-4">
                    <img src="${user.picture.medium}" class="mb-2" alt="User Photo">
                    <div>
                      <p class="mb-1">Name: ${user.name.first} ${user.name.last}</p>
                      <p class="mb-0">Email: ${user.email}</p>
                    </div>
                  </div>`;
              }

              dataContainer.innerHTML = usersData;
            } else {
              dataContainer.textContent = "No users found.";
            }
          })
          .catch(function (error) {
            dataContainer.textContent = "An error occurred while fetching users.";
          });
      });
    </script>
  </body>
</html>

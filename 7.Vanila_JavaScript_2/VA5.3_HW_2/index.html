<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Random Todos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container mt-3">
      <h1>Random Todos</h1>
      <button id="getTodoBtn" class="btn btn-primary mt-3">Get Random Todos</button>
      <div id="dataContainer" class="mt-3"></div>
    </div>

    <script>
      const getTodoBtn = document.querySelector("#getTodoBtn");
      const dataContainer = document.querySelector("#dataContainer");

      const apiUrl = "https://jsonplaceholder.typicode.com/todos";

      getTodoBtn.addEventListener("click", function () {
        dataContainer.textContent = 'Loading...';

        fetch(apiUrl)
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            let todosData = "";

            for (let i = 0; i < 3; i++) {
              const todo = data[i];
              todosData += `
                <div class="card mb-3">
                  <div class="card-body">
                    <h5 class="card-title">${todo.title}</h5>
                    <p class="card-text">${todo.completed ? "Completed" : "Not Completed"}</p>
                  </div>
                </div>`;
            }

            dataContainer.innerHTML = todosData;
          })
          .catch(function (error) {
            dataContainer.textContent = "An error occurred while fetching todos.";
          });
      });
    </script>
  </body>
</html>

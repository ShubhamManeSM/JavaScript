<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>User Registration</h1>
  <form id="postForm" class="mb-3">
    <div class="mb-3">
      <label for="username" class="form-label">Username:</label>
      <input type="text" id="username" class="form-control">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input type="email" id="email" class="form-control">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password:</label>
      <input type="password" id="password" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
  </form>

  <div id="responseContainer" class="mt-3"></div>

  <script>
    const postForm = document.querySelector('#postForm');
    const responseContainer = document.querySelector('#responseContainer');
    const username = document.querySelector('#username');
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');

    postForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const apiUrl = "https://jsonplaceholder.typicode.com/users";
      const requestData = {
        username: username.value,
        email: email.value,
        password: password.value
      };

      fetch(apiUrl, {
        method: "POST",
        body: JSON.stringify(requestData),
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(function(response){
       return response.json()
      }).then(function (data){
        if(data){
          responseContainer.textContent = JSON.stringify(data);
        }else{
          responseContainer.textContent = 'Failed to make the POST call.'
        }
      }).catch(function(error){
        responseContainer.textContent = 'An error occurred while making the POST call.';
      });
    });
  </script>
</body>
</html>

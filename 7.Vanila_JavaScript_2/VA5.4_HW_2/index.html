<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Comment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>Create Comment</h1>

  <form id="commentForm" class="mb-3">
    <div class="mb-3">
      <label for="name" class="form-label">Name:</label>
      <input type="text" id="name" class="form-control">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input type="email" id="email" class="form-control">
    </div>

    <div class="mb-3">
      <label for="body" class="form-label">Comment:</label>
      <textarea id="body" class="form-control" rows="3" cols="30"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Add Comment</button>
  </form>

  <div id="responseContainer" class="mt-3"></div>

  <script>
    const form = document.querySelector('#commentForm');
    const responseContainer = document.querySelector('#responseContainer');
    const nameInput = document.querySelector('#name');
    const emailInput = document.querySelector('#email');
    const bodyInput = document.querySelector('#body');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const apiUrl = 'https://jsonplaceholder.typicode.com/comments';
      const requestData = {
        name: nameInput.value,
        email: emailInput.value,
        body: bodyInput.value
      };

      fetch(apiUrl, {
        method: 'POST',
        body: JSON.stringify(requestData),
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(function(response){
        return response.json()
      })
      .then(function(data){
        responseContainer.textContent = JSON.stringify(data);
      })
      .catch(function(error){
        responseContainer.textContent = 'An error occurred while posting the comment.';
      });
    });
  </script>
</body>
</html>

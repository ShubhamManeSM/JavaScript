<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Book Database</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">
  <h1>Book Database</h1>

  <h2>GET Request</h2>
  <button id="getBooks" class="btn btn-primary mb-3">Get Data</button>
  <div id="bookList" class="mb-4"></div>
  <div id="getBookContainer"></div>

  <h2>POST Request</h2>
  <form id="bookForm" class="mb-3">
    <label for="bookName">Book Name:</label><br />
    <input id="bookName" class="form-control mb-2" /><br />
    <label for="author">Author:</label><br />
    <input id="author" class="form-control mb-2" /><br />
    <button type="submit" class="btn btn-success">Submit</button>
  </form>
  <div id="postBookContainer" style="font-family: monospace;"></div>

  <script>
    const getBooks = document.querySelector("#getBooks");
    const bookList = document.querySelector("#bookList");
    const getBookContainer = document.querySelector("#getBookContainer");
    const bookForm = document.querySelector("#bookForm");
    const bookName = document.querySelector("#bookName");
    const author = document.querySelector("#author");
    const postBookContainer = document.querySelector("#postBookContainer");
    const apiUrl = "https://post-books-student-neog.replit.app/books";

    let lastAddedBookId = null;

    // Show only the last added book when "Get Data" is clicked
    getBooks.addEventListener("click", function () {
      bookList.innerHTML = "";
      if (!lastAddedBookId) {
        getBookContainer.textContent = "No book added yet.";
        return;
      }

      fetch(apiUrl)
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          const found = data.find(function (book) {
            return book._id === lastAddedBookId;
          });

          if (found) {
            const card = document.createElement("div");
            card.className = "card p-3 mb-3";

            const idElem = document.createElement("h5");
            idElem.innerHTML = "Book ID: <b>" + found._id + "</b>";

            const jsonElem = document.createElement("pre");
            jsonElem.textContent = JSON.stringify(found);

            card.appendChild(idElem);
            card.appendChild(jsonElem);
            bookList.appendChild(card);
            getBookContainer.textContent = "";
          } else {
            getBookContainer.textContent = "Book not found.";
          }
        })
        .catch(function () {
          getBookContainer.textContent = "An error occurred while getting the book.";
        });
    });

    // POST Request - show raw JSON only
    bookForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const bookData = {
        bookName: bookName.value,
        author: author.value,
      };

      fetch(apiUrl, {
        method: "POST",
        body: JSON.stringify(bookData),
        headers: {
          "Content-Type": "application/json",
        },
      })
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          if (data && data._id) {
            lastAddedBookId = data._id;
            postBookContainer.textContent = JSON.stringify(data);
            bookForm.reset();
          } else {
            postBookContainer.textContent = "Failed to add book.";
          }
        })
        .catch(function () {
          postBookContainer.textContent = "An error occurred while adding the book.";
        });
    });
  </script>
</body>
</html>

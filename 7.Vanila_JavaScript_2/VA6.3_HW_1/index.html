<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="container py-4">
    <h1>Movie List</h1>
    <ul id="movieList" class="list-group"></ul>

    <script>
      const apiUrl = "https://va-5-assignment-express-student-neog.replit.app/movies"
      const movieList = document.querySelector("#movieList")

      function fetchData(){
        movieList.textContent = "Loading..."
        fetch(apiUrl)
        .then(function(response){
          return response.json()
        })
        .then(function(data){
          if(data){
            movieList.textContent = ""
            for(let i = 0; i < data.length; i++){
            const liElements = document.createElement('li')
            liElements.innerHTML = `${data[i].title} - Release Year: ${data[i].releaseYear} - Genre: ${data[i].genre} <button class="btn btn-danger float-end mt-1" data-id="${data[i]._id}" id="deleteBtn">Delete</button>`
            movieList.appendChild(liElements)
          }
          }
          const deleteButtons = document.querySelectorAll('#deleteBtn')
          for(let i = 0 ; i < deleteButtons.length; i++){
            deleteButtons[i].addEventListener("click",function(event){
              const moviesId = event.target.getAttribute('data-id')
              const apiDeleteUrl = `https://va-5-assignment-express-student-neog.replit.app/movies/${moviesId}`
              fetch(apiDeleteUrl, {
                method: "DELETE"
              }).then(function (response){
                return response.json()
              }).then(function(data){
                if(data){
                  fetchData()
                }
              })
            })
          }
        })
        .catch(function(error){
          movieList.textContent = "An error occured while fetching data."
        })
      }

      fetchData()
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="container py-4">
    <h1>Employee List</h1>
    <ul id="employeeList" class="row"></ul>

    <script>
      const apiUrl = "https://employee-management-backend-student-neog-ca.replit.app/employees"
      const employeeList = document.querySelector("#employeeList")

      function fetchData(){
        employeeList.textContent = "Loading..."
        fetch(apiUrl)
        .then(function(response){
          return response.json()
        })
        .then(function(data){
          if(data){
            employeeList.textContent = ""
            for(let i = 0; i < data.length; i++){
            const liElements = document.createElement('li')
            liElements.innerHTML = `${data[i].name} - Department:  ${data[i].department} - Gender: ${data[i].gender} <button class="btn btn-danger float-end mt-1" data-id="${data[i]._id}" id="deleteBtn">Delete</button>`
            employeeList.appendChild(liElements)
          }
          }
          const deleteButtons = document.querySelectorAll('#deleteBtn')
          for(let i = 0 ; i < deleteButtons.length; i++){
            deleteButtons[i].addEventListener("click",function(event){
              const employeeId = event.target.getAttribute('data-id')
              const apiDeleteUrl = `https://employee-management-backend-student-neog-ca.replit.app/employees/${employeeId}`
              fetch(apiDeleteUrl, {
                method: "DELETE"
              }).then(function (response){
                return response.json()
              }).then(function(data){
                if(data){
                  fetchData()
                }
              })
            })
          }
        })
        .catch(function(error){
          employeeList.textContent = "An error occured while fetching data."
        })
      }

      fetchData()
    </script>
  </body>
</html>

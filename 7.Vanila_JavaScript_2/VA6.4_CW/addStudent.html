<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      #success{
        display: none;
      }
    </style>
  </head>
  <body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg text-secondary bg-white shadow-sm">
          <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Student Management</a>
      
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
      
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="student.html">Student</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="addStudent.html">Add Student</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </header>

      <main> 
    <div class="container">
        <h1 class="mt-3">Add Student</h1>

        <form id="addStudent">

        <label for="name">Name:</label><br>
        <input type="text" class="form-control" id="name"><br>

        <label for="age">Age:</label><br>
        <input type="number" class="form-control" id="age"><br>

        <label for="gender">Gender:</label>
        <select id="gender" class="">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select><br>

        <label for="grade" class="mt-3">Grade:</label><br>
        <input type="text" class="form-control" id="grade"><br>

        <label for="marks">Marks:</label><br>
        <input type="text" class="form-control" id="marks"><br>

        <label for="attendance">Attendance:</label><br>
        <input type="text" class="form-control" id="attendance"><br>

        <button id="addStudentBtn" class="btn btn-primary">Add Student</button>
    </form>
    <div id="success">Student data added successfully</div>
  </div>

  </main>

  <script>
    const addStudent = document.querySelector("#addStudent")
    const name = document.querySelector("#name")
    const age = document.querySelector("#age")
    const gender = document.querySelector("#gender")
    const grade = document.querySelector("#grade")
    const marks = document.querySelector("#marks")
    const attendance = document.querySelector("#attendance")
    const success = document.querySelector("#success")
    const apiUrl = 'https://student-data-Student-neoG-Ca.replit.app/students'

    addStudent.addEventListener("submit",function(event){
      event.preventDefault()

      const studentData = {
        name: name.value,
        age: age.value,
        gender: gender.value,
        grade: grade.value,
        marks: marks.value,
        attendance: attendance.value
      }

      fetch(apiUrl, {
        method: "POST",
        body: JSON.stringify(studentData),
        headers:{
          'Content-Type' : 'application/json'
        }
      })
      .then(function(response){
        return response.json()
      })
      .then(function(data){
        if(data){
          success.style.display = "block"
        }
      })
      .catch(function () {
        studentData.textContent = "An error occurred while fetching data."
      })
    })
  </script>
    
</body>
</html>

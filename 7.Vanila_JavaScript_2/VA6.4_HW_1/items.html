<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      .bg-mint {
        background-color: #66f0b6;
      }
    </style>
  </head>
  <body class="bg-light">

    <!-- Navbar -->
    <header>
      <nav class="navbar navbar-expand-lg text-secondary bg-white shadow-sm">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">Inventory Management</a>
    
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
    
          <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="items.html">Item List</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="addItems.html">Add Items</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <div class="container mb-3">
      <h1 class="mt-3">Item List</h1>

      <label for="filter" class="form-label mt-3">Filter by Category:</label>
      <select id="filter" class="form-select mt-1" required>
          <option value="All">All</option>
          <option value="Perishable">Perishable</option>
          <option value="Non-Perishable">Non-Perishable</option>
      </select>

      <ul class="list-group mt-3" id="itemList"></ul>
    </div>

    <script>
      const apiUrl = 'https://inventory-management-student-neog-ca.replit.app/inventory';
      const itemList = document.querySelector("#itemList");
      const filterSelect = document.querySelector("#filter");
      let allItems = [];

      function renderItems(data) {
        itemList.innerHTML = "";

        if (data.length === 0) {
          itemList.innerHTML = "<li class='list-group-item'>No Items found.</li>";
          return;
        }

        for (let i = 0; i < data.length; i++) {
          const item = data[i];
          const liElement = document.createElement('li');
          liElement.className = "list-group-item mt-2";
          liElement.innerHTML = `
            ${item.itemName} - Quantity: ${item.quantity} - Category: ${item.category}
            <button class="btn btn-danger float-end mt-1" data-id="${item._id}">Delete</button>
          `;
          itemList.appendChild(liElement);
        }

        const deleteButtons = document.querySelectorAll('[data-id]');
        deleteButtons.forEach(button => {
          button.addEventListener("click", function (event) {
            const itemId = event.target.getAttribute('data-id');
            const deleteUrl = `${apiUrl}/${itemId}`;

            fetch(deleteUrl, {
              method: "DELETE"
            })
              .then(response => response.json())
              .then(data => {
                if (data) {
                  fetchData();
                }
              });
          });
        });
      }

      function applyFilter() {
        const selectedFilter = filterSelect.value;
        if (selectedFilter === "All") {
          renderItems(allItems);
        } else {
          const filteredItems = allItems.filter(item => item.category === selectedFilter);
          renderItems(filteredItems);
        }
      }

      function fetchData() {
        itemList.textContent = "Loading...";
        fetch(apiUrl)
          .then(response => response.json())
          .then(data => {
            allItems = data;
            applyFilter();
          })
          .catch(() => {
            itemList.textContent = "An error occurred while fetching data.";
          });
      }

      filterSelect.addEventListener("change", applyFilter);

      fetchData();
    </script>

  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICC Player Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-light">

    <header>
      <nav class="navbar navbar-expand-lg text-secondary bg-white shadow-sm">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">ICC Player Management</a>
    
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
    
          <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="players.html">Player List</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="addPlayers.html">Add Players</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <div class="container mb-3">
      <h1 class="mt-3">Player List</h1>

      <label for="filter" class="form-label mt-3">Filter by Playing Role:</label>
      <select id="filter" class="form-select mt-1" required>
          <option value="All-rounder">All-rounder</option>
          <option value="Batsman">Batsman</option>
          <option value="Bowler">Bowler</option>
      </select>

      <ul class="list-group mt-3" id="playerList"></ul>
    </div>

    <script>
      const apiUrl = 'https://players-backend-student-neog-ca.replit.app/players';
      const playerList = document.querySelector("#playerList");
      const filterSelect = document.querySelector("#filter");
      let allPlayers = [];

      function renderPlayers(data) {
        playerList.innerHTML = "";

        if (data.length === 0) {
          playerList.innerHTML = "<li class='list-group-item'>No Players found.</li>";
          return;
        }

        for (let i = 0; i < data.length; i++) {
          const player = data[i];
          const liElement = document.createElement('li');
          liElement.className = "list-group-item mt-2";
          liElement.innerHTML = `
            ${player.fullName} - Playing Role: ${player.playingRole} - Nationality: ${player.nationality}
            <button class="btn btn-danger float-end mt-1" data-id="${player._id}">Delete</button>
          `;
          playerList.appendChild(liElement);
        }

        const deleteButtons = document.querySelectorAll('[data-id]');
        deleteButtons.forEach(button => {
          button.addEventListener("click", function (event) {
            const playerId = event.target.getAttribute('data-id');
            const deleteUrl = `${apiUrl}/${playerId}`;

            fetch(deleteUrl, {
              method: "DELETE"
            })
              .then(response => response.json())
              .then(data => {
                if (data) {
                  fetchData();
                }
              });
          });
        });
      }

      function applyFilter() {
        const selectedFilter = filterSelect.value;
        if (selectedFilter === "All-rounder") {
          renderPlayers(allPlayers);
        } else {
          const filteredPlayers = allPlayers.filter(player => player.playingRole === selectedFilter);
          renderPlayers(filteredPlayers);
        }
      }

      function fetchData() {
        playerList.textContent = "Loading...";
        fetch(apiUrl)
          .then(response => response.json())
          .then(data => {
            allPlayers = data;
            applyFilter();
          })
          .catch(() => {
            playerList.textContent = "An error occurred while fetching data.";
          });
      }

      filterSelect.addEventListener("change", applyFilter);

      fetchData();
    </script>

  </body>
</html>
